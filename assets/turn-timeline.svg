<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" font-family="Georgia, serif"><rect width="940" height="590" fill="#14110e"/><text x="28" y="44" font-size="19" fill="#f3e6c4">One turn is 720</text><text x="28" y="66" font-size="13" fill="#bda978">A step costs 40. A blow costs what the weapon weighs. And the clock runs while you decide.</text><text x="28" y="115" font-size="13" fill="#f3e6c4">You, a sword in hand</text><text x="28" y="131" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">Bloody Blade, 96 a swing</text><rect x="238" y="90" width="674" height="54" rx="2" fill="#1d1812" stroke="#6e5424" stroke-width="1"/><rect x="238.0" y="91" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="256.7" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="275.4" y="91" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="294.2" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="312.9" y="91" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="331.6" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="350.3" y="91" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="369.1" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="387.8" y="91" width="89.9" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="432.7" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">swing 96</text><rect x="477.6" y="91" width="89.9" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="522.6" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">swing 96</text><rect x="567.5" y="91" width="89.9" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="612.4" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">swing 96</text><rect x="657.4" y="91" width="89.9" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="702.3" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">swing 96</text><rect x="747.2" y="91" width="89.9" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="792.2" y="121" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">swing 96</text><text x="844.1" y="121" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">80 left</text><text x="28" y="211" font-size="13" fill="#f3e6c4">You, a hammer in hand</text><text x="28" y="227" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">Doom Hammer, 240 a swing</text><rect x="238" y="186" width="674" height="54" rx="2" fill="#1d1812" stroke="#6e5424" stroke-width="1"/><rect x="238.0" y="187" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="256.7" y="217" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="275.4" y="187" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="294.2" y="217" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="312.9" y="187" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="331.6" y="217" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="350.3" y="187" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="369.1" y="217" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="387.8" y="187" width="224.7" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="500.1" y="217" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">swing 240</text><rect x="612.4" y="187" width="224.7" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="724.8" y="217" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">swing 240</text><text x="844.1" y="217" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">80 left</text><text x="28" y="307" font-size="13" fill="#f3e6c4">A Skeleton, light on its feet</text><text x="28" y="323" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">a blow every 180</text><rect x="238" y="282" width="674" height="54" rx="2" fill="#1d1812" stroke="#6e5424" stroke-width="1"/><rect x="238.0" y="283" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="256.7" y="313" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="275.4" y="283" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="294.2" y="313" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="312.9" y="283" width="168.5" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="397.1" y="313" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">blow 180</text><rect x="481.4" y="283" width="168.5" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="565.6" y="313" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">blow 180</text><rect x="649.9" y="283" width="168.5" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="734.1" y="313" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">blow 180</text><text x="825.4" y="313" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">100 left</text><text x="28" y="403" font-size="13" fill="#f3e6c4">A Golem, slow and heavy</text><text x="28" y="419" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">a blow every 360</text><rect x="238" y="378" width="674" height="54" rx="2" fill="#1d1812" stroke="#6e5424" stroke-width="1"/><rect x="238.0" y="379" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="256.7" y="409" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="275.4" y="379" width="37.4" height="52" fill="#2f6f6b" stroke="#14110e" stroke-width="1"/><text x="294.2" y="409" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">step</text><rect x="312.9" y="379" width="337.0" height="52" fill="#b4532b" stroke="#14110e" stroke-width="1"/><text x="481.4" y="409" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">blow 360</text><text x="656.9" y="409" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">280 left</text><text x="28" y="499" font-size="13" fill="#f3e6c4">You, thinking about it</text><text x="28" y="515" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">5 a second — 144s a turn</text><rect x="238" y="474" width="674" height="54" rx="2" fill="#1d1812" stroke="#6e5424" stroke-width="1"/><rect x="238.0" y="475" width="140.4" height="52" fill="#4a3f2a" stroke="#14110e" stroke-width="1"/><text x="308.2" y="505" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">30 seconds</text><rect x="378.4" y="475" width="140.4" height="52" fill="#4a3f2a" stroke="#14110e" stroke-width="1"/><text x="448.6" y="505" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">30 seconds</text><rect x="518.8" y="475" width="140.4" height="52" fill="#4a3f2a" stroke="#14110e" stroke-width="1"/><text x="589.0" y="505" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">30 seconds</text><rect x="659.2" y="475" width="140.4" height="52" fill="#4a3f2a" stroke="#14110e" stroke-width="1"/><text x="729.5" y="505" text-anchor="middle" font-size="11" fill="#f3e6c4" font-family="IBM Plex Mono, monospace">30 seconds</text><text x="806.7" y="505" font-size="11" fill="#7d7054" font-family="IBM Plex Mono, monospace">120 left</text><line x1="238" x2="912" y1="542" y2="542" stroke="#6e5424"/><line x1="238.0" x2="238.0" y1="542" y2="547" stroke="#6e5424"/><text x="238.0" y="560" text-anchor="middle" font-size="10" fill="#7d7054" font-family="IBM Plex Mono, monospace">0</text><line x1="350.3" x2="350.3" y1="542" y2="547" stroke="#6e5424"/><text x="350.3" y="560" text-anchor="middle" font-size="10" fill="#7d7054" font-family="IBM Plex Mono, monospace">120</text><line x1="462.7" x2="462.7" y1="542" y2="547" stroke="#6e5424"/><text x="462.7" y="560" text-anchor="middle" font-size="10" fill="#7d7054" font-family="IBM Plex Mono, monospace">240</text><line x1="575.0" x2="575.0" y1="542" y2="547" stroke="#6e5424"/><text x="575.0" y="560" text-anchor="middle" font-size="10" fill="#7d7054" font-family="IBM Plex Mono, monospace">360</text><line x1="687.3" x2="687.3" y1="542" y2="547" stroke="#6e5424"/><text x="687.3" y="560" text-anchor="middle" font-size="10" fill="#7d7054" font-family="IBM Plex Mono, monospace">480</text><line x1="799.7" x2="799.7" y1="542" y2="547" stroke="#6e5424"/><text x="799.7" y="560" text-anchor="middle" font-size="10" fill="#7d7054" font-family="IBM Plex Mono, monospace">600</text><line x1="912.0" x2="912.0" y1="542" y2="547" stroke="#6e5424"/><text x="912.0" y="560" text-anchor="middle" font-size="10" fill="#7d7054" font-family="IBM Plex Mono, monospace">720</text></svg>